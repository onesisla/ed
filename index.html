<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Edward and I</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <style>
    html {
      background: #444;
      font-family: sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      border: none;
    }
    #fullscreenButton {
      position: absolute;
      top: 20px; right: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      z-index: 10;
      transition: background-color 0.3s ease;
    }
    #fullscreenButton:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <img id="presplash" src="web-presplash.jpg" style="display:none;">

  <!-- フルスクリーントグルボタン -->
  <button id="fullscreenButton">フルスクリーン開始</button>

  <script>
    const button = document.getElementById('fullscreenButton');

    function isFullscreen() {
      return document.fullscreenElement 
        || document.webkitFullscreenElement 
        || document.mozFullScreenElement 
        || document.msFullscreenElement;
    }

    function requestFullscreen() {
      const docEl = document.documentElement;
      const request = docEl.requestFullscreen
        || docEl.webkitRequestFullscreen
        || docEl.mozRequestFullScreen
        || docEl.msRequestFullscreen;
      if (request) {
        request.call(docEl).catch(err => {
          alert(`フルスクリーンの開始に失敗しました: ${err.message}`);
        });
      } else {
        alert('このブラウザはフルスクリーンをサポートしていません。');
      }
    }

    function exitFullscreen() {
      const exit = document.exitFullscreen
        || document.webkitExitFullscreen
        || document.mozCancelFullScreen
        || document.msExitFullscreen;
      if (exit) {
        exit.call(document);
      }
    }

    button.addEventListener('click', () => {
      if (isFullscreen()) {
        exitFullscreen();
      } else {
        requestFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', updateButton);
    document.addEventListener('webkitfullscreenchange', updateButton);
    document.addEventListener('mozfullscreenchange', updateButton);
    document.addEventListener('MSFullscreenChange', updateButton);

    function updateButton() {
      if (isFullscreen()) {
        button.textContent = 'フルスクリーン解除';
      } else {
        button.textContent = 'フルスクリーン開始';
      }
    }
  </script>

  <script src="renpy-pre.js"></script>
  <script src="renpy.js" async></script>
</body>
</html>
