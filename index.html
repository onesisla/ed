<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <title>Edward and I</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="manifest.json" rel="manifest">
  <link href="icons/icon-192x192.png" rel="icon" sizes="192x192" type="image/png">
  <meta content="#000" name="theme-color">
  <style>
    html {
      background: #444;
      font-family: sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      border: none;
    }
    /* フルスクリーンボタンを中央表示 */
    #fullscreenButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 1.5rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      z-index: 10000;
      transition: background-color 0.3s ease;
    }
    #fullscreenButton:hover {
      background-color: #0056b3;
    }
    /* 既存スタイルはそのまま */
    .visible { visibility: visible; opacity: 1; transition: opacity .1s linear; }
    .hidden { visibility: hidden; opacity: 0; transition: visibility 0s .25s, opacity .25s linear; }
    #inputDiv, #statusDiv {
      background: rgba(0, 0, 0, .75);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 10px;
      position: absolute;
      top: 0; left: 0; right: 0;
      border-radius: 0 0 5px 5px;
    }
    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }
    #statusProgress {
      display: none;
      width: 100%;
    }
    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }
    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;
    }
    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }
    #inputText:focus {
      color: #fff;
    }
    #ContextContainer {
      position: absolute;
      left: 0; top: 0;
      color: #fff;
    }
    #ContextContainer.shown {
      background: rgba(0, 0, 0, .5);
      border-radius: 0 0 5px 0;
    }
    #ContextButton {
      text-decoration: none;
      color: #d3d3d3;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      padding: 10px 10px;
      opacity: .75;
    }
    #ContextButton:focus {
      outline: 0;
      color: #fff;
      opacity: 1;
    }
    #ContextMenu a {
      text-decoration: none;
      color: #d3d3d3;
      background: #444;
      height: 48px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid #d3d3d3;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 5px 5px;
      opacity: 1;
    }
    #ContextMenu a:hover {
      background: #666;
      color: #fff;
    }
    #presplash {
      position: absolute;
      top: 0; left: 0;
      display: block;
      margin: auto;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <img id="presplash" src="web-presplash.jpg">

  <!-- フルスクリーントグルボタン（中央表示） -->
  <button id="fullscreenButton">フルスクリーン開始</button>

  <div id="ContextContainer">
    <a id="ContextButton">≡</a><br>
    <div id="ContextMenu" style="display:none">
      <input id="ID_SavegamesImport" accept="application/zip" onchange="onSavegamesImport(this)" style="display:none" type="file">
      <a href="javascript:document.getElementById('ID_SavegamesImport').click();">Import Saves</a>
      <a href="javascript:onSavegamesExport();">Export Saves</a>
      <a href="javascript:FSDownload('/log.txt', 'text/plain');">Download Log</a>
      <a href="https://www.renpy.org/" target="_blank">Powered by Ren'Py</a>
    </div>
  </div>

  <div id="statusDiv" class="hidden">
    <div id="statusTextDiv"></div>
    <progress id="statusProgress" max="100" value="0"></progress>
  </div>

  <div id="inputDiv" class="hidden">
    <form id="inputForm">
      <div id="inputPrompt"></div>
      <input id="inputText">
    </form>
  </div>

  <script>
    const button = document.getElementById('fullscreenButton');

    function isFullscreen() {
      return document.fullscreenElement 
        || document.webkitFullscreenElement 
        || document.mozFullScreenElement 
        || document.msFullscreenElement;
    }

    function requestFullscreen() {
      const docEl = document.documentElement;
      const request = docEl.requestFullscreen
        || docEl.webkitRequestFullscreen
        || docEl.mozRequestFullScreen
        || docEl.msRequestFullscreen;
      if (request) {
        request.call(docEl).catch(err => {
          alert(`フルスクリーンの開始に失敗しました: ${err.message}`);
        });
      } else {
        alert('このブラウザはフルスクリーンをサポートしていません。');
      }
    }

    function exitFullscreen() {
      const exit = document.exitFullscreen
        || document.webkitExitFullscreen
        || document.mozCancelFullScreen
        || document.msExitFullscreen;
      if (exit) {
        exit.call(document);
      }
    }

    button.addEventListener('click', () => {
      if (isFullscreen()) {
        exitFullscreen();
      } else {
        requestFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', updateButton);
    document.addEventListener('webkitfullscreenchange', updateButton);
    document.addEventListener('mozfullscreenchange', updateButton);
    document.addEventListener('MSFullscreenChange', updateButton);

    function updateButton() {
      if (isFullscreen()) {
        button.textContent = 'フルスクリーン解除';
      } else {
        button.textContent = 'フルスクリーン開始';
      }
    }
  </script>

  <script>
    navigator.serviceWorker && (navigator.serviceWorker.controller || navigator.serviceWorker.register("./service-worker.js", {
      updateViaCache: "all"
    }));
  </script>

  <script src="renpy-pre.js"></script>
  <script src="renpy.js" async></script>
</body>
</html>
